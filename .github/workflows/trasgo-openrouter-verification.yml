name: Trasgo OpenRouter Verification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trasgo-openrouter-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify secret exists
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Run multimodel verification
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node experiments/openrouter-verification/run.mjs

      - name: Commit machine-readable results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/data/openrouter-latest.json docs/verification/data/openrouter-raw.jsonl
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "evidence: publish OpenRouter verification run"
          git push
